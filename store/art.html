<!doctype html>
<!-- Chrome Web Store screenshots and promo tiles. Rendered to store/assets/ by store/render.sh.
     ?v=shot1|shot2|small|marquee -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlikely store art</title>
<style>
  :root { --pink: #f91880; --fg: #e7e9ea; --muted: #8b98a5; --line: #2f3336; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 85% 10%, #3a0a24 0%, #0b0d10 60%) #0b0d10;
    color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 28px; }
  .brand img { width: 48px; height: 48px; margin: -8px; } /* icon128 has 1/8 padding baked in */
  h1 { font-size: 56px; line-height: 1.05; letter-spacing: -.02em; margin: 28px 0 20px; font-weight: 800; }
  h1 em { font-style: normal; color: var(--pink); }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; font-size: 21px; color: #c9d1d9; }
  li::before { content: "♥"; color: var(--pink); margin-right: 12px; }

  /* Fake likes timeline (generic, no X branding) */
  .window {
    position: absolute; background: #000; border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .bar { height: 40px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #2f3336; }
  .bar span { margin-left: 16px; font-size: 13px; color: var(--muted); background: #16181c; padding: 5px 14px; border-radius: 999px; }
  .tab { padding: 16px 24px; font-weight: 800; font-size: 20px; border-bottom: 1px solid var(--line); }
  .post { display: flex; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); transition: opacity .2s; }
  .post .av { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .post .body { flex: 1; }
  .post .who { font-size: 15px; font-weight: 700; }
  .post .who span { color: #71767b; font-weight: 400; }
  .post .line { height: 10px; border-radius: 5px; background: #202327; margin-top: 10px; }
  .post .heart { color: var(--pink); font-size: 16px; margin-top: 12px; }
  .post.gone { opacity: .25; }
  .post.gone .heart { color: #71767b; }

  .popup {
    position: absolute; width: 302px; border: 1px solid var(--line); border-radius: 12px; background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,.7); overflow: hidden;
  }
  .popup iframe { display: block; width: 300px; border: 0; color-scheme: dark; }

  .pill {
    position: absolute; display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 14px; border-radius: 999px; background: #0f1419; color: #e7e9ea;
    border: 1px solid #2f3336; font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); transform-origin: left bottom;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }
  .pill .msg { color: #8b98a5; }
  .pill button { all: unset; padding: 5px 12px; border-radius: 999px; font-weight: 700; background: #eff3f4; color: #0f1419; }
  .pill.cooldown .dot { background: #ffd400; }

  .copy { position: absolute; }
  .tag { display: inline-block; font-size: 15px; font-weight: 700; color: var(--pink); border: 1px solid var(--pink);
         padding: 6px 12px; border-radius: 999px; margin-top: 28px; }
  .tag + .tag { margin-left: 8px; }

  /* Promo tiles */
  .tile { position: absolute; inset: 0; display: flex; align-items: center; }
  .big-heart { width: 200px; height: 200px; }
</style>
</head>
<body>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'shot1';
  const SIZES = { shot1: [1280, 800], shot2: [1280, 800], small: [440, 280], marquee: [1400, 560] };
  const [W, H] = SIZES[v];
  document.body.style.width = W + 'px';
  document.body.style.height = H + 'px';

  const COLORS = ['#7856ff', '#00ba7c', '#ffd400', '#1d9bf0', '#ff7a00', '#f91880'];
  const NAMES = [['Morning Coffee', 'coffeeclub'], ['Dev Notes', 'devnotes'], ['Space Pics', 'spacepics'],
                 ['Cat Facts', 'catfacts'], ['Weekend Hikes', 'trailtalk'], ['Old Memes', 'memearchive'],
                 ['Hot Takes', 'takes'], ['Recipe Box', 'recipebox']];
  const posts = (n, goneFirst) => NAMES.slice(0, n).map(([name, h], i) => `
    <div class="post ${i < goneFirst ? 'gone' : ''}">
      <div class="av" style="background:${COLORS[i % COLORS.length]}"></div>
      <div class="body">
        <div class="who">${name} <span>@${h} · ${i + 2}y</span></div>
        <div class="line" style="width:${92 - (i * 13) % 30}%"></div>
        <div class="line" style="width:${60 - (i * 7) % 25}%"></div>
        <div class="heart">${i < goneFirst ? '♡' : '♥'} <span style="color:#71767b;font-size:13px">${(i * 37) % 90 + 3}</span></div>
      </div>
    </div>`).join('');

  const windowHTML = (x, y, w, h, gone) => `
    <div class="window" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="bar"><i></i><i></i><i></i><span>x.com/i/history/likes</span></div>
      <div class="tab">Likes</div>
      ${posts(8, gone)}
    </div>`;
  const popupHTML = (x, y, state, h, openSettings) => `
    <div class="popup" style="left:${x}px;top:${y}px">
      <iframe src="../test/popup-preview.html?state=${state}" style="height:${h}px" data-settings="${openSettings}"></iframe>
    </div>`;
  const pillHTML = (x, y, cls, text, btn, scale = 1.3) => `
    <div class="pill ${cls}" style="left:${x}px;top:${y}px;transform:scale(${scale})">
      <span class="dot"></span><span>${text}</span>${btn ? `<button>${btn}</button>` : ''}
    </div>`;
  const brand = (size = 28) => `<div class="brand" style="font-size:${size}px"><img src="../icons/icon128.png" alt="">Unlikely</div>`;

  const html = {
    shot1: `
      <div class="copy" style="left:72px;top:150px;width:470px">
        ${brand()}
        <h1>Unlike <em>every</em> tweet you ever liked.</h1>
        <ul>
          <li>Open your likes, press Start</li>
          <li>Removes thousands of likes on X</li>
          <li>Keeps going while you do other things</li>
        </ul>
        <span class="tag">Free</span><span class="tag">Open source</span><span class="tag">No login</span>
      </div>
      ${windowHTML(600, 90, 620, 760, 3)}
      ${popupHTML(880, 150, 'running', 268, false)}
      ${pillHTML(630, 700, '', '<b>137</b> unliked <span class="msg">· Unliking…</span>', 'Stop')}`,
    shot2: `
      <div class="copy" style="left:72px;top:150px;width:480px">
        ${brand()}
        <h1>Handles rate limits <em>for you</em>.</h1>
        <ul>
          <li>Pauses and resumes on its own</li>
          <li>Clears stubborn “ghost” likes</li>
          <li>Careful, Normal or Fast speed</li>
          <li>Optional stop-after limit</li>
        </ul>
      </div>
      ${windowHTML(600, 90, 620, 760, 4)}
      ${popupHTML(880, 120, 'cooldown', 405, true)}
      ${pillHTML(630, 700, 'cooldown', '<b>412</b> unliked <span class="msg">· Rate-limited · resuming in 1:35</span>', 'Stop')}`,
    small: `
      <div class="tile" style="padding:0 30px;gap:22px">
        <img src="../icons/icon128.png" style="width:150px;height:150px;margin:-19px" alt="">
        <div>
          <div style="font-size:40px;font-weight:800;letter-spacing:-.02em">Unlikely</div>
          <div style="font-size:19px;line-height:1.3;color:#c9d1d9;margin-top:8px">Unlike all your<br>X (Twitter) likes<br>in one click</div>
        </div>
      </div>`,
    marquee: `
      <div class="tile" style="padding:0 90px;gap:60px">
        <div style="width:640px">
          ${brand(30)}
          <h1 style="font-size:60px;margin:24px 0 0">Delete all your<br><em>X (Twitter) likes</em><br>in one click.</h1>
          <span class="tag">Free</span><span class="tag">Open source</span><span class="tag">No login</span>
        </div>
        ${popupHTML(900, 146, 'running', 268, false)}
      </div>`,
  }[v];
  document.write(html);

  // Popup preview: dark mode, no preview chrome, optionally open the settings panel.
  for (const f of document.querySelectorAll('iframe')) {
    f.addEventListener('load', () => {
      const d = f.contentDocument;
      d.body.style.cssText = 'margin:0;border:0';
      // Wait for popup.js to load its (stubbed) settings before overriding them.
      if (f.dataset.settings === 'true') setTimeout(() => {
        d.querySelector('details').open = true;
        d.getElementById('speed-normal').checked = true;
        d.getElementById('ghosts').checked = true;
      }, 300);
    });
  }
</script>
</body>
</html>
